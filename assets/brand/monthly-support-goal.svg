<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PQVPN monthly budget: 13 euro current cost and 100 US dollar target</title>
  <desc id="desc">A dark network-themed card showing 13 euro of current monthly infrastructure cost, a 100 US dollar support target, and an animated performance-boost zone beyond the infrastructure baseline.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.55" stop-color="#10132d"/>
      <stop offset="1" stop-color="#190d2d"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9b5cff" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#33405c" stroke-width="2"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>

  <g opacity=".5" stroke="url(#signal)" stroke-width="2">
    <path d="M775 70L895 122L1032 72L1138 130" fill="none"/>
    <path d="M812 246L925 192L1065 236L1152 190" fill="none"/>
  </g>
  <g fill="#00e5ff" filter="url(#glow)">
    <circle cx="775" cy="70" r="4"/><circle cx="895" cy="122" r="4"/><circle cx="1032" cy="72" r="4"/><circle cx="1138" cy="130" r="4"/>
  </g>
  <g fill="#9b5cff" filter="url(#glow)">
    <circle cx="812" cy="246" r="4"/><circle cx="925" cy="192" r="4"/><circle cx="1065" cy="236" r="4"/><circle cx="1152" cy="190" r="4"/>
  </g>

  <text x="58" y="60" fill="#00e5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="3">MONTHLY RUN RATE</text>
  <text x="54" y="151" fill="#f5f7ff" font-family="Inter, Segoe UI, sans-serif" font-size="82" font-weight="800">€13</text>
  <text x="248" y="137" fill="#aeb8cc" font-family="Inter, Segoe UI, sans-serif" font-size="24">current infrastructure</text>
  <text x="248" y="173" fill="#aeb8cc" font-family="Inter, Segoe UI, sans-serif" font-size="24">$100 monthly support target</text>

  <rect x="58" y="214" width="636" height="18" rx="9" fill="#050a14" stroke="#33405c"/>
  <rect x="58" y="214" width="83" height="18" rx="9" fill="#00e5ff" opacity=".72"/>
  <path d="M151 223H685" stroke="url(#signal)" stroke-width="5" stroke-dasharray="16 12" stroke-linecap="round" opacity=".35">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".28;.9;.28" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <circle cx="141" cy="223" r="8" fill="#f5f7ff" filter="url(#glow)">
    <animate attributeName="r" values="6;10;6" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="58" y="270" fill="#77839a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">€13 BASELINE</text>
  <text x="214" y="270" fill="#9b5cff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">→ PERFORMANCE BOOST</text>
  <text x="694" y="228" fill="#77839a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">$100 GOAL</text>
  <text x="58" y="298" fill="#667188" font-family="Inter, Segoe UI, sans-serif" font-size="14">Beyond €13: measured optimization, testing and maintainer time — no automatic infrastructure spend.</text>
</svg>
