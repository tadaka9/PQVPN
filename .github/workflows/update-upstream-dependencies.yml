name: Update upstream dependencies

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: future

      - name: Resolve latest stable upstream releases
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag() {
            gh api "repos/$1/releases/latest" --jq .tag_name
          }
          stable_tag() {
            git ls-remote --tags --refs "https://github.com/$1.git" "$2" |
              awk '{sub("refs/tags/", "", $2); print $2}' |
              grep -E "$3" | sort -V | tail -1
          }

          {
            echo "OPENSSL_VERSION=$(release_tag openssl/openssl | sed 's/^openssl-//')"
            echo "ARGON2_VERSION=$(release_tag P-H-C/phc-winner-argon2)"
            echo "LIBOQS_VERSION=$(release_tag open-quantum-safe/liboqs)"
            echo "SPDLOG_TAG=$(release_tag gabime/spdlog)"
            echo "ASIO_TAG=$(stable_tag chriskohlhoff/asio 'asio-*' '^asio-[0-9]+-[0-9]+-[0-9]+$')"
            echo "CATCH2_TAG=$(release_tag catchorg/Catch2)"
            echo "GOOGLETEST_TAG=$(release_tag google/googletest)"
            echo "QT_VERSION=$(stable_tag qt/qtbase 'v6.*' '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//')"
          } > .github/dependencies.env.new

          test "$(wc -l < .github/dependencies.env.new)" -eq 8
          while IFS='=' read -r key value; do
            test -n "$key"
            test -n "$value"
          done < .github/dependencies.env.new
          mv .github/dependencies.env.new .github/dependencies.env

      - name: Update CI actions to latest stable releases
        shell: bash
        run: |
          set -euo pipefail
          stable_action_tag() {
            git ls-remote --tags --refs "https://github.com/$1.git" 'v*' |
              awk '{sub("refs/tags/", "", $2); print $2}' |
              grep -E '^v[0-9]+(\.[0-9]+){0,2}$' | sort -V | tail -1
          }

          export PQVPN_ACTION_REFS
          PQVPN_ACTION_REFS="$(cat <<EOF
          actions/checkout=$(stable_action_tag actions/checkout)
          actions/cache=$(stable_action_tag actions/cache)
          actions/upload-artifact=$(stable_action_tag actions/upload-artifact)
          microsoft/setup-msbuild=$(stable_action_tag microsoft/setup-msbuild)
          ilammy/msvc-dev-cmd=$(stable_action_tag ilammy/msvc-dev-cmd)
          jurplel/install-qt-action=$(stable_action_tag jurplel/install-qt-action)
          EOF
          )"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml')
          text = workflow.read_text(encoding='utf-8')
          for line in os.environ['PQVPN_ACTION_REFS'].splitlines():
              action, tag = line.strip().split('=', 1)
              if not re.fullmatch(r'v[0-9]+(?:\.[0-9]+){0,2}', tag):
                  raise SystemExit(f'unsafe action tag for {action}: {tag!r}')
              pattern = rf'(uses:\s*{re.escape(action)}@)[^\s#]+'
              text, count = re.subn(pattern, rf'\g<1>{tag}', text)
              if count == 0:
                  raise SystemExit(f'action is no longer referenced by ci.yml: {action}')
          workflow.write_text(text, encoding='utf-8')
          PY

      - name: Update future and prepare the main integration PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/dependencies.env .github/workflows/ci.yml; then
            echo 'Every dependency and CI action already matches its latest stable upstream release.'
            exit 0
          fi

          branch=future
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/dependencies.env .github/workflows/ci.yml
          git commit -m 'Update CI dependencies to latest stable releases'
          git push origin "HEAD:$branch"

          pr_number="$(gh pr list --state open --head "$branch" --base main --json number --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create --base main --head "$branch" \
              --title 'Integrate validated future development into main' \
              --body 'Integrates development from future, including updates to centralized dependency pins from official stable upstream releases. Required checks and review must pass before merging into protected main.')"
            pr_number="${pr_url##*/}"
          fi

          gh workflow run ci.yml --ref "$branch"
          gh workflow run build.yml --ref "$branch"
          gh workflow run codeql.yml --ref "$branch"
          gh workflow run attribution-policy.yml --ref "$branch"
          echo "Integration PR #$pr_number is ready for validation and review."
