name: Build and Test

on:
  push:
    branches: [main, future]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-linux:
    name: Build on Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev pkg-config libargon2-dev

      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build -j$(nproc)
          ctest --test-dir build -j2 --output-on-failure

  build-macos:
    name: Build on macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install cmake ninja openssl pkg-config argon2

      - name: Build and test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix openssl)/lib/pkgconfig:$(brew --prefix argon2)/lib/pkgconfig"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build -j$(sysctl -n hw.ncpu)
          ctest --test-dir build -j2 --output-on-failure

  build-windows:
    name: Build on Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          choco install cmake ninja -y

      - name: Build and test
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build -j$(nproc)
          ctest --test-dir build -j2 --output-on-failure

  driver-tests:
    name: Driver HLK/DDI Tests (Windows x64)
    runs-on: windows-latest
    needs: [build-windows]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          choco install cmake ninja -y

      - name: Build driver tests
        shell: bash
        run: |
          cmake -S . -B build-driver -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPQVPN_BUILD_DRIVER_TESTS=ON
          cmake --build build-driver --target irp_fuzz_test

      - name: Validate HLK configuration
        shell: pwsh
        run: |
          # Verify HLK config file is valid XML
          [xml]$config = Get-Content driver/pqvpn_tunnel/hlk_tests/pqvpn_tunnel.hlkx
          Write-Host "HLK configuration validated successfully"
          
          # Check that all required test suites are present
          $suites = $config.TestConfiguration.TestSuite | ForEach-Object { $_.Name }
          if (-not ($suites -contains "NDIS_Miniport")) {
            Write-Error "Missing NDIS_Miniport test suite"
            exit 1
          }
          if (-not ($suites -contains "DDI_Compliance")) {
            Write-Error "Missing DDI_Compliance test suite"
            exit 1
          }
          Write-Host "All required HLK test suites present"

  driver-signing:
    name: Driver Code Signing (Windows x64)
    runs-on: windows-latest
    needs: [driver-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/future'
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          choco install cmake ninja -y

      - name: Build driver
        shell: bash
        run: |
          cmake -S . -B build-driver -G Ninja -DCMAKE_BUILD_TYPE=Release -DPQVPN_BUILD_DRIVER_TESTS=ON
          cmake --build build-driver --target pqvpn_tunnel

      - name: Sign driver with EV certificate
        shell: pwsh
        env:
          EV_CERT_PFX: ${{ secrets.EV_CERT_PFX }}
          EV_CERT_PASSWORD: ${{ secrets.EV_CERT_PASSWORD }}
          TIMESTAMP_SERVER: ${{ secrets.TIMESTAMP_SERVER || 'http://timestamp.digicert.com' }}
        run: |
          if (-not $env:EV_CERT_PFX) {
            Write-Host "WARNING: EV certificate not configured. Skipping signing." -ForegroundColor Yellow
            exit 0
          }
          
          # Decode base64 PFX to file
          $pfxBytes = [Convert]::FromBase64String($env:EV_CERT_PFX)
          $certPath = Join-Path $env:TEMP "pqvpn-ev-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $pfxBytes)
          
          # Sign the driver
          & .\driver\pqvpn_tunnel\signing\sign_driver.ps1 `
            -DriverPath build-driver\pqvpn_tunnel.sys `
            -CertPfx $certPath `
            -CertPassword (ConvertTo-SecureString $env:EV_CERT_PASSWORD -AsPlainText -Force) `
            -TimestampServer $env:TIMESTAMP_SERVER `
            -Verify
          
          # Clean up certificate file
          Remove-Item $certPath -Force

      - name: Upload signed driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: pqvpn-tunnel-signed-driver
          path: build-driver/pqvpn_tunnel.sys
          retention-days: 30

  hardening-gate:
    name: Security Hardening Gate
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev pkg-config libargon2-dev python3

      - name: Run hardening gate
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build -j$(nproc)
          python3 tools/pqvpn_hard_kernel.py