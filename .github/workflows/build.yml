name: Unit tests and hardening

on:
  push:
    branches: [main, future]
  pull_request:
    branches: [main, future]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-tests:
    name: Compile PQVPN Windows driver and test utility
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - uses: microsoft/setup-msbuild@v2

      - name: Build PQVPN tunnel driver with supported WDK
        shell: pwsh
        run: |
          msbuild driver/pqvpn_tunnel/pqvpn_tunnel.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'WDK restore failed' }
          $wdk = "$env:USERPROFILE\.nuget\packages\microsoft.windows.wdk.x64\10.0.28000.2526\c"
          $env:PATH = "$wdk\bin\10.0.28000.0\x64;$env:PATH"
          $sdkPackage = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.cpp\10.0.28000.*" |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkPackage) { throw 'Matching Windows SDK NuGet package was not restored' }
          $sdk = Join-Path $sdkPackage.FullName 'c'
          msbuild driver/pqvpn_tunnel/pqvpn_tunnel.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off `
            /p:SkipPackageVerification=true "/p:WindowsSdkDir=$sdk\" "/p:WDKContentRoot=$wdk\" /m
          if ($LASTEXITCODE -ne 0) { throw 'PQVPN tunnel driver build failed' }
          if (-not (Test-Path driver/build/x64/Release/pqvpn_tunnel.sys)) {
            throw 'Driver build did not produce pqvpn_tunnel.sys'
          }

      - name: Install dependencies
        run: |
          choco install cmake ninja -y

      - name: Build driver tests
        shell: bash
        working-directory: driver/pqvpn_tunnel
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64
          cmake --build build --config Debug --target irp_fuzz_test

      - name: Validate HLK configuration XML
        shell: pwsh
        run: |
          # Verify HLK config file is valid XML
          [xml]$config = Get-Content driver/pqvpn_tunnel/hlk_tests/pqvpn_tunnel.hlkx
          Write-Host "HLK configuration validated successfully"
          
          # Check that all required test suites are present
          $suites = $config.TestConfiguration.TestSuite | ForEach-Object { $_.Name }
          if (-not ($suites -contains "NDIS_Miniport")) {
            Write-Error "Missing NDIS_Miniport test suite"
            exit 1
          }
          if (-not ($suites -contains "DDI_Compliance")) {
            Write-Error "Missing DDI_Compliance test suite"
            exit 1
          }
          Write-Host "All required HLK test suites present"

      - name: Upload unsigned driver build
        uses: actions/upload-artifact@v6
        with:
          name: pqvpn-tunnel-driver-unsigned-x64
          path: |
            driver/build/x64/Release/pqvpn_tunnel.sys
            driver/build/x64/Release/pqvpn_tunnel.inf
          if-no-files-found: error
          retention-days: 7

  hardening-gate:
    name: Security Hardening Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev pkg-config libargon2-dev
          git clone --depth 1 --branch 0.12.0 https://github.com/open-quantum-safe/liboqs.git "$RUNNER_TEMP/liboqs"
          cmake -S "$RUNNER_TEMP/liboqs" -B "$RUNNER_TEMP/liboqs-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="KEM_ml_kem_1024;SIG_ml_dsa_87"
          cmake --build "$RUNNER_TEMP/liboqs-build" --parallel 2
          sudo cmake --install "$RUNNER_TEMP/liboqs-build"
          # Ensure pkg-config and CMake can find the newly installed liboqs
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH" | tee -a $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=/usr/local:$CMAKE_PREFIX_PATH" | tee -a $GITHUB_ENV

      - name: Run hardening gate
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build -L hardening --output-on-failure
