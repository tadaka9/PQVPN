name: Native functional release gates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to qualify
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  readiness:
    name: Validate immutable tag and manifest before native tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Verify tag checkout and source integrity
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo '::error::Start this workflow from the exact release tag ref, not from main.'
            exit 1
          fi
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          python3 tools/check-release-readiness.py --tag "$TAG" --integrity-only
      - name: Report source qualification gaps
        run: |
          echo 'Source integrity validated; each native target must now satisfy the full evidence contract.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Missing native drivers or signatures will fail their respective jobs.' >> "$GITHUB_STEP_SUMMARY"

  native-gate:
    name: Functional gate ${{ matrix.target }}
    needs: readiness
    environment: release-functional-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs_on: macos-15
          - target: macos-x86_64
            runs_on: macos-15-intel
          - target: windows-arm64
            runs_on: [self-hosted, pqvpn-release, Windows, ARM64]
          - target: windows-x86_64
            runs_on: windows-2025
          - target: linux-arm64
            runs_on: ubuntu-24.04-arm
          - target: linux-x86_64
            runs_on: ubuntu-24.04
          - target: appimage-arm64
            runs_on: ubuntu-24.04-arm
          - target: appimage-x86_64
            runs_on: ubuntu-24.04
          - target: deb-arm64
            runs_on: ubuntu-24.04-arm
          - target: deb-x86_64
            runs_on: ubuntu-24.04
          - target: rpm-arm64
            runs_on: ubuntu-24.04-arm
          - target: rpm-x86_64
            runs_on: ubuntu-24.04
          - target: arch-x86_64
            runs_on: ubuntu-24.04
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - name: Resolve qualified commit
        shell: bash
        run: echo "PQVPN_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build, sign, install, exercise tunnel, and uninstall
        shell: bash
        env:
          PQVPN_TARGET: ${{ matrix.target }}
          PQVPN_OUTPUT_DIR: ${{ runner.temp }}/pqvpn-gate-output
          PQVPN_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          driver="packaging/gates/$PQVPN_TARGET"
          if [[ ! -f "$driver" || ! -x "$driver" ]]; then
            echo "::error::Missing executable native qualification driver: $driver"
            exit 1
          fi
          "$driver"
      - name: Preserve native gate diagnostic logs on all outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qualification-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/pqvpn-gate-output/evidence.json
            ${{ runner.temp }}/pqvpn-gate-output/verification.log
          if-no-files-found: warn
          retention-days: 30
      - name: Validate exact candidate and full evidence contract
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT: ${{ runner.temp }}/pqvpn-gate-output
        run: |
          set -euo pipefail
          python3 tools/validate-functional-evidence.py \
            --target "$TARGET" --commit "$PQVPN_COMMIT_SHA" \
            --version "$(cat PQVPN_VERSION.txt)" \
            --runner-os "$RUNNER_OS" --runner-arch "$RUNNER_ARCH" \
            --evidence-dir "$OUTPUT" --candidate-dir "$OUTPUT/candidate"
          echo 'Evidence structure and hashes verified; independent provenance attestation follows.'
      - name: Attest exact release candidate
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/pqvpn-gate-output/candidate/*
      - name: Upload functional evidence
        uses: actions/upload-artifact@v6
        with:
          name: functional-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/pqvpn-gate-output/evidence.json
            ${{ runner.temp }}/pqvpn-gate-output/verification.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload attested release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/pqvpn-gate-output/candidate/*
          if-no-files-found: error
          retention-days: 30
