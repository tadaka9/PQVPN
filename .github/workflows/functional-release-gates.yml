name: Native functional release gates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to qualify
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  readiness:
    name: Refuse until native gate implementations exist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Require dispatch from the same immutable tag
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check all native qualification prerequisites
        run: python3 tools/check-release-readiness.py --tag "${{ inputs.tag }}"

  native-gate:
    name: Functional gate ${{ matrix.target }}
    needs: readiness
    environment: release-functional-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runs_on: macos-15
          - target: macos-x86_64
            runs_on: macos-15-intel
          - target: windows-arm64
            runs_on: [self-hosted, pqvpn-release, Windows, ARM64]
          - target: windows-x86_64
            runs_on: windows-2025
          - target: linux-arm64
            runs_on: ubuntu-24.04-arm
          - target: linux-x86_64
            runs_on: ubuntu-24.04
          - target: appimage-arm64
            runs_on: ubuntu-24.04-arm
          - target: appimage-x86_64
            runs_on: ubuntu-24.04
          - target: deb-arm64
            runs_on: ubuntu-24.04-arm
          - target: deb-x86_64
            runs_on: ubuntu-24.04
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - name: Resolve qualified commit
        shell: bash
        run: echo "PQVPN_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build, sign, install, exercise tunnel, and uninstall
        shell: bash
        env:
          PQVPN_TARGET: ${{ matrix.target }}
          PQVPN_OUTPUT_DIR: ${{ runner.temp }}/pqvpn-gate-output
        run: packaging/gates/${{ matrix.target }}
      - name: Validate gate output contract
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT: ${{ runner.temp }}/pqvpn-gate-output
        run: |
          test -s "$OUTPUT/evidence.json"
          test -s "$OUTPUT/verification.log"
          test "$(find "$OUTPUT/candidate" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1
          jq -e --arg target "$TARGET" --arg sha "$PQVPN_COMMIT_SHA" '
            .schema == 1 and .target == $target and .commit_sha == $sha and
            .passed == true and .native_runner == true and
            .privileged_tunnel_e2e == true and
            .bidirectional_traffic == true and .route_dns_rollback == true and
            .clean_install_upgrade_remove == true and
            .architecture_verified == true and
            .runtime_dependencies_verified == true and
            .platform_signature_verified == true and
            .provenance_verified == true
          ' "$OUTPUT/evidence.json"
      - name: Attest exact release candidate
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/pqvpn-gate-output/candidate/*
      - name: Upload functional evidence
        uses: actions/upload-artifact@v6
        with:
          name: functional-evidence-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/pqvpn-gate-output/evidence.json
            ${{ runner.temp }}/pqvpn-gate-output/verification.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload attested release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/pqvpn-gate-output/candidate/*
          if-no-files-found: error
          retention-days: 30
