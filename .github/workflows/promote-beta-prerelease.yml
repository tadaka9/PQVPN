name: Promote verified beta tag and prerelease

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Recovery: workflow_run is not reliably chained after token-dispatched CI.
  # The recovery job still demands completed successful exact-tag CI evidence.
  push:
    branches: [future]

# Trusted workflow_run event from successful CI in this repository only.
# Tags created with GITHUB_TOKEN do not trigger push workflows, so we
# explicitly dispatch CI on the immutable beta tag.
permissions:
  actions: write
  contents: write

concurrency:
  group: promote-pqvpn-beta
  cancel-in-progress: false

jobs:
  create-immutable-beta-tag:
    name: Create new beta tag after green future CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'future' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify future commit, create immutable tag and dispatch tagged CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin future
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          test "$(git rev-parse origin/future)" = "$CI_SHA"
          version="$(tr -d '[:space:]' < PQVPN_VERSION.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9A-Za-z.]+-beta(-[0-9A-Za-z.-]+)?$ ]]
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; no change is allowed."
            exit 0
          fi
          if existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            if [[ "$existing" != "$CI_SHA" ]]; then
              if git merge-base --is-ancestor "$existing" "$CI_SHA"; then
                echo "Tag $tag is immutable at an earlier commit already on future."
                exit 0
              fi
              echo "::error::Tag $tag is not in future ancestry; refusing any retag."
              exit 1
            fi
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$CI_SHA" >/dev/null
            echo "Created immutable tag $tag at $CI_SHA"
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "Dispatched tagged CI for $tag from future CI $CI_RUN_ID."

  publish-verified-tag-build:
    name: Dispatch experimental prerelease after green tagged CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verify beta tag and dispatch protected publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          [[ "$CI_SHA" =~ ^[0-9a-f]{40}$ && "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9A-Za-z.]+-beta(-[0-9A-Za-z.-]+)?$ ]]
          git fetch origin future --tags
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$CI_SHA"
          test "$(git rev-parse HEAD)" = "$CI_SHA"
          test "v$(tr -d '[:space:]' < PQVPN_VERSION.txt)" = "$TAG"
          git merge-base --is-ancestor "$CI_SHA" origin/future
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease $TAG exists; no duplicate publication."
            exit 0
          fi
          gh workflow run publish-test-prerelease.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$TAG" \
            -f "tag=$TAG" -f "ci_run_id=$CI_RUN_ID"
          echo "Dispatched attestation and protected beta publication for $TAG."

  resume-existing-tag-publisher:
    name: Resume publication of all exact-tag CI assets
    if: github.event_name == 'push' && github.ref == 'refs/heads/future'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find successful exact-tag CI and dispatch protected publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < PQVPN_VERSION.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]{8}-[0-9A-Za-z.]+-beta(-[0-9A-Za-z.-]+)?$ ]]
          tag="v$version"
          git fetch origin future --tags
          if ! tag_sha="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null)"; then
            echo "Tag $tag is not created yet; waiting for the successful future CI promotion."
            exit 0
          fi
          test -n "$tag_sha"
          git merge-base --is-ancestor "$tag_sha" origin/future
          test "v$(git show "$tag_sha:PQVPN_VERSION.txt" | tr -d '[:space:]')" = "$tag"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease $tag already exists; not mutating published artifacts."
            exit 0
          fi
          # Only a successful CI run on this exact tag and commit is eligible;
          # a green PR or branch build is never a substitute.
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?per_page=100")"
          run_id="$(jq -r --arg tag "$tag" --arg sha "$tag_sha" --arg repo "$GITHUB_REPOSITORY" '
            [.workflow_runs[] | select(
              .event == "workflow_dispatch" and
              .head_branch == $tag and .head_sha == $sha and
              .status == "completed" and .conclusion == "success" and
              .head_repository.full_name == $repo
            )] | sort_by(.run_number) | last | .id // empty' <<< "$run_json")"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Exact-tag CI for $tag ($tag_sha) is not green yet; publication remains pending."
            exit 0
          fi
          names="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[].name')"
          for target in windows-x86_64 linux-x86_64 linux-arm64 macos-x86_64 macos-arm64; do
            if ! grep -Fxq "release-candidate-$target" <<< "$names"; then
              echo "::error::Exact-tag CI is missing candidate artifact: $target"
              exit 1
            fi
          done
          echo "All five native build candidates exist in tagged CI run $run_id."
          # Execute the publisher workflow from trusted main, while it checks
          # out the immutable TAG and verifies candidates from the tagged CI.
          gh workflow run publish-test-prerelease.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f "tag=$tag" -f "ci_run_id=$run_id"
          echo "Triggered protected prerelease publication for $tag."
