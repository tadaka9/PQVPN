name: Attribution policy

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce attribution policy
        run: tools/check-attribution-policy.sh
      - name: Verify release participation suffix
        run: tools/check-release-participation.sh
