name: One-time consolidation to main and future
on:
  push:
    branches: [future]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: pqvpn-one-time-branch-consolidation
  cancel-in-progress: false
jobs:
  remove-merged-branches:
    if: github.repository == 'tadaka9/PQVPN' && github.ref == 'refs/heads/future'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify ancestry and delete only four already integrated branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/future)"
          git merge-base --is-ancestor "$(git rev-parse refs/remotes/origin/main)" HEAD
          # Validate every head before mutating any ref.
          while read -r branch expected; do
            case "$branch" in
              fix/complete-beta-prerelease-publication|fix/linux-distribution-artifact-gates-20261014|fix/ota-calendar-order-20261014-pr27|fix/tag-ci-report-qualification-20261014) ;;
              *) echo "::error::Unexpected branch in cleanup allowlist: $branch"; exit 1 ;;
            esac
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            test "$current" = "$expected"
            test "$(git rev-parse "refs/remotes/origin/$branch")" = "$current"
            git merge-base --is-ancestor "$current" HEAD
            git merge-base --is-ancestor "$current" "$(git rev-parse refs/remotes/origin/main)"
            pending="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" |
              jq -r --arg ref "$branch" '[.[] | select(.head.ref == $ref)] | length')"
            test "$pending" = 0
            echo "Safe to remove $branch ($current): already integrated, no open PR."
          done <<'BRANCHES'
          fix/complete-beta-prerelease-publication d53c70585e173c89e8689387818276f58a9769fc
          fix/linux-distribution-artifact-gates-20261014 d418a6b42b5323ade176de55680ae1591e246804
          fix/ota-calendar-order-20261014-pr27 f7853cdddb403dd35e83a5dde589106d51d8a012
          fix/tag-ci-report-qualification-20261014 34f94dd4e78a3cf72c5c3ced27c18013fb63eadc
          BRANCHES
          for branch in \
            fix/complete-beta-prerelease-publication \
            fix/linux-distribution-artifact-gates-20261014 \
            fix/ota-calendar-order-20261014-pr27 \
            fix/tag-ci-report-qualification-20261014; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted merged branch $branch"
          done
          actual="$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" |
            jq -r '[.[].name] | sort | join(",")')"
          test "$actual" = 'future,main'
          echo "Verified final remote branch set: $actual"
