name: GitHub Pages

on:
  push:
    branches: [main]
    paths: [site/**, assets/brand/**, docs/assets/**, config.json, packaging/linux/pqvpn-mainnet*, .github/FUNDING.yml, .github/workflows/pages.yml]
  pull_request:
    branches: [main]
    paths: [site/**, assets/brand/**, docs/assets/**, config.json, packaging/linux/pqvpn-mainnet*, .github/FUNDING.yml, .github/workflows/pages.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate static site and Mainnet registry
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          test "$(head -c 4 site/wasm/quantum_field.wasm | od -An -tx1 | tr -d ' \n')" = '0061736d'
          jq -e '.schema_version == 1 and (.peers | type == "array")' site/mainnet/peers.json >/dev/null
          jq -e '
            (.peers | length > 0)
            and ([.peers[] | has("ipv4") and has("ipv6") and has("endpoints") and has("address_status")] | all)
            and ([.peers[] | select(.ipv6 != null) | .endpoints[] | startswith("[")] | any)
          ' site/mainnet/peers.json >/dev/null
          grep -F 'id="mainnet"' site/index.html >/dev/null
          grep -F 'id="support"' site/index.html >/dev/null
          grep -F 'id="strangenet-peer"' site/index.html >/dev/null
          grep -F 'id="field-manual"' site/index.html >/dev/null
          grep -F 'id="project-version"' site/index.html >/dev/null
          grep -F 'id="mobile-android-qr"' site/index.html >/dev/null
          grep -F 'id="mobile-ios-qr"' site/index.html >/dev/null
          grep -F "'android-arm64':name=>name.endsWith('android-arm64-preview-test-signed.apk')" site/app.js >/dev/null
          grep -F "'ios-arm64':name=>name.endsWith('ios-arm64-preview-unsigned.zip')" site/app.js >/dev/null
          grep -F "projectVersion.textContent=newestRelease.tag_name" site/app.js >/dev/null
          grep -F -- '--strangenet-peer ${values.peer.toLowerCase()}' site/app.js >/dev/null
          grep -F 'api.github.com/repos/tadaka9/PQVPN' site/app.js >/dev/null
          grep -F 'bc1qt6lrt8ces62pvp6ws9audr5mdhu0ht9qkga2ll' site/index.html >/dev/null
          grep -F 'DE29100110012626679655' site/index.html >/dev/null
          grep -F 'setInterval(()=>{if(!document.hidden)loadRegistry()},60000)' site/app.js >/dev/null
          jq -e '.bootstrap[0].host == "65.108.251.110"' config.json >/dev/null
          test -x packaging/linux/pqvpn-mainnet-update
          test -s packaging/linux/pqvpn-mainnet.service
          test -s packaging/linux/pqvpn-mainnet-update.service
          test -s packaging/linux/pqvpn-mainnet-update.timer
          test -s site/mainnet/no-logs-policy.html
          ! grep -E '(src|href)="\.\./(assets|docs)/' site/index.html
      - name: Stage the Pages root
        shell: bash
        run: |
          mkdir -p public/assets/brand public/docs/assets
          cp -R site/. public/
          cp -R assets/brand/. public/assets/brand/
          cp docs/assets/pqvpn-console.png public/docs/assets/
      - name: Install privacy-preserving QR generator
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qrencode
      - name: Refresh published fleet release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="$(curl --fail --silent --show-error --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/tadaka9/PQVPN/releases?per_page=20')"
          latest="$(jq -er '[.[] | select(.draft == false and (.tag_name | startswith("v")))] | sort_by(.published_at) | last | .tag_name' <<<"$releases")"
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq --arg release "$latest" --arg checked "$checked_at" '
            .updated_at = $checked
            | .release_basis = "latest published PQVPN release; runtime availability remains independently observable"
            | .peers |= map(.release = $release)
          ' public/mainnet/peers.json > public/mainnet/peers.json.tmp
          mv public/mainnet/peers.json.tmp public/mainnet/peers.json
          jq -e --arg release "$latest" '
            (.updated_at | type == "string")
            and (.peers | length > 0)
            and ([.peers[].release] | all(. == $release))
          ' public/mainnet/peers.json >/dev/null
          mobile="$(jq -c '[.[] | select(
            .draft == false
            and any(.assets[]?; .name == "SHA256SUMS")
            and any(.assets[]?; (.name | endswith("android-arm64-preview-test-signed.apk")))
            and any(.assets[]?; (.name | endswith("ios-arm64-preview-unsigned.zip")))
          )] | sort_by(.published_at) | last // empty' <<<"$releases")"
          if [[ -n "$mobile" ]]; then
            mobile_tag="$(jq -r '.tag_name' <<<"$mobile")"
            android_url="$(jq -r '.assets[] | select(.name | endswith("android-arm64-preview-test-signed.apk")) | .browser_download_url' <<<"$mobile")"
            ios_url="$(jq -r '.assets[] | select(.name | endswith("ios-arm64-preview-unsigned.zip")) | .browser_download_url' <<<"$mobile")"
            qrencode --type=SVG --output=public/assets/mobile-android-qr.svg -- "$android_url"
            qrencode --type=SVG --output=public/assets/mobile-ios-qr.svg -- "$ios_url"
            jq -n --arg tag "$mobile_tag" --arg android "$android_url" --arg ios "$ios_url" \
              '{available:true,tag:$tag,android_url:$android,ios_url:$ios}' > public/mobile-downloads.json
            test -s public/assets/mobile-android-qr.svg
            test -s public/assets/mobile-ios-qr.svg
          else
            rm -f public/assets/mobile-android-qr.svg public/assets/mobile-ios-qr.svg
            jq -n '{available:false}' > public/mobile-downloads.json
          fi
          jq -e '.available | type == "boolean"' public/mobile-downloads.json >/dev/null
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
