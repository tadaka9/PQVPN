name: CI

on:
  pull_request:
  push:
    branches: [main, future]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
            family: linux
            expected_machine: x86-64
          - target: linux-arm64
            os: ubuntu-24.04-arm
            family: linux
            expected_machine: aarch64
          - target: macos-x86_64
            os: macos-15-intel
            family: macos
            expected_machine: x86_64
          - target: macos-arm64
            os: macos-15
            family: macos
            expected_machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Load dependency versions
        shell: bash
        run: cat .github/dependencies.env >> "$GITHUB_ENV"

      - name: Restore upstream dependency cache
        id: upstream-deps
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pqvpn-deps
          key: ci-deps-v3-${{ matrix.target }}-${{ hashFiles('.github/dependencies.env') }}

      - name: Install build tools on Linux
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build pkg-config perl make

      - name: Install build tools on macOS
        if: matrix.family == 'macos'
        run: brew install ninja pkg-config

      - name: Build official upstream dependencies
        if: steps.upstream-deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/pqvpn-deps"
          mkdir -p "$prefix"

          git clone --depth 1 --branch "openssl-$OPENSSL_VERSION" https://github.com/openssl/openssl.git "$RUNNER_TEMP/openssl"
          pushd "$RUNNER_TEMP/openssl"
          ./Configure --prefix="$prefix" --libdir=lib no-shared no-tests
          make -j2
          make install_sw
          popd

          git clone --depth 1 --branch "$ARGON2_VERSION" https://github.com/P-H-C/phc-winner-argon2.git "$RUNNER_TEMP/argon2"
          make -C "$RUNNER_TEMP/argon2" -j2
          make -C "$RUNNER_TEMP/argon2" PREFIX="$prefix" install
          mkdir -p "$prefix/lib/pkgconfig"
          cat > "$prefix/lib/pkgconfig/libargon2.pc" <<EOF
          prefix=$prefix
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: libargon2
          Description: Upstream Argon2 password hashing library
          Version: $ARGON2_VERSION
          Libs: -L\${libdir} -largon2
          Cflags: -I\${includedir}
          EOF

          git clone --depth 1 --branch "$LIBOQS_VERSION" https://github.com/open-quantum-safe/liboqs.git "$RUNNER_TEMP/liboqs"
          cmake -S "$RUNNER_TEMP/liboqs" -B "$RUNNER_TEMP/liboqs-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="KEM_ml_kem_1024;SIG_ml_dsa_87" \
            -DOPENSSL_ROOT_DIR="$prefix" \
            -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --build "$RUNNER_TEMP/liboqs-build" --parallel 2
          cmake --install "$RUNNER_TEMP/liboqs-build"

      - name: Verify upstream dependency versions
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/pqvpn-deps"
          argon_archive="$(find "$prefix" -type f -name 'libargon2.a' -print -quit)"
          test -n "$argon_archive"
          if [ "$argon_archive" != "$prefix/lib/libargon2.a" ]; then
            cp "$argon_archive" "$prefix/lib/libargon2.a"
          fi
          test "$($prefix/bin/openssl version | awk '{print $2}')" = "$OPENSSL_VERSION"
          test "$(PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig" pkg-config --modversion libargon2)" = "$ARGON2_VERSION"
          test "$(PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig" pkg-config --modversion liboqs)" = "$LIBOQS_VERSION"

      - name: Install upstream Qt for the native GUI
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ env.QT_VERSION }}'
          cache: true

      - name: Configure
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/pqvpn-deps/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$RUNNER_TEMP/pqvpn-deps/lib/pkgconfig"
          export CMAKE_PREFIX_PATH="$QT_ROOT_DIR;$RUNNER_TEMP/pqvpn-deps"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DPQVPN_BUILD_MONITOR=ON

      - name: Compile node, terminal console and native GUI
        run: cmake --build build --target pqvpn_node pqvpn_tui pqvpn_monitor --parallel 2

      - name: Build and render Privacy Console
        shell: bash
        run: |
          QT_QPA_PLATFORM=offscreen \
            PQVPN_SMOKE_PAGE=strangenet \
            PQVPN_SMOKE_IMAGE="$RUNNER_TEMP/pqvpn-console.png" \
            build/pqvpn_monitor --smoke-test
          test -s "$RUNNER_TEMP/pqvpn-console.png"

      - name: Verify architecture and CLI startup
        shell: bash
        run: |
          file build/pqvpn_node | tee binary-type.txt
          grep -F "${{ matrix.expected_machine }}" binary-type.txt
          build/pqvpn_node --help
          build/pqvpn_node --validate-config --config config.json
          build/pqvpn_node --platform-info
          build/pqvpn_node --smoke-test --config config.json
          build/pqvpn_node --smoke-test --config config.udp2raw.json
          build/pqvpn_tui --smoke-test --config config.json
          if [[ "${{ matrix.family }}" == macos ]]; then
            otool -L build/pqvpn_node | tee runtime-dependencies.txt
          else
            ldd build/pqvpn_node | tee runtime-dependencies.txt
          fi

      - name: Resolve package version
        shell: bash
        run: |
          ver="$(tr -d '[:space:]' < PQVPN_VERSION.txt)"
          echo "PQVPN_VERSION=$ver" >> "$GITHUB_ENV"

      - name: Package verified native build
        shell: bash
        run: |
          stage="PQVPN-${{ env.PQVPN_VERSION }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cmake --install build --prefix "$GITHUB_WORKSPACE/$stage"
          # GNUInstallDirs installs the executables under bin/. A macOS app
          # bundle would land at the prefix root, so accept either layout.
          test -e "$stage/bin/pqvpn_node"
          test -e "$stage/bin/pqvpn_tui"
          monitor="$stage/bin/pqvpn_monitor"
          if [ ! -e "$monitor" ]; then
            monitor="$stage/pqvpn_monitor.app/Contents/MacOS/pqvpn_monitor"
          fi
          test -e "$monitor"
          tar -czf "PQVPN-${{ env.PQVPN_VERSION }}-${{ matrix.target }}.tar.gz" "$stage"

      - name: Build deb package (Linux only)
        if: matrix.family == 'linux'
        shell: bash
        run: |
          chmod +x packaging/linux/build-package.sh
          ./packaging/linux/build-package.sh build artifacts "${{ env.PQVPN_VERSION }}"
          test -n "$(find artifacts -maxdepth 1 -name 'pqvpn_*.deb' -print -quit)"
          # Place the deb next to the tar.gz at the workspace root so the
          # release-candidate artifact stores it at its root (not under
          # artifacts/). The publish gate counts *.deb at release/ root after
          # merge-multiple download; a nested artifacts/ prefix would hide them.
          cp artifacts/pqvpn_*.deb ./

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ matrix.target }}
          path: |
            PQVPN-${{ env.PQVPN_VERSION }}-${{ matrix.target }}.tar.gz
            pqvpn_*.deb
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-2025
            triplet: x64-windows-static
            architecture: x64
            generator: Visual Studio 18 2026
            expected_arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Load dependency versions
        shell: bash
        run: cat .github/dependencies.env >> "$GITHUB_ENV"

      - uses: microsoft/setup-msbuild@v2

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore upstream dependency cache
        id: windows-upstream-deps
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pqvpn-deps
          key: ci-deps-v3-${{ matrix.target }}-${{ hashFiles('.github/dependencies.env') }}

      - name: Build official OpenSSL and liboqs releases
        if: steps.windows-upstream-deps.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP\pqvpn-deps"
          New-Item -ItemType Directory -Force -Path $prefix | Out-Null

          git clone --depth 1 --branch "openssl-$env:OPENSSL_VERSION" https://github.com/openssl/openssl.git "$env:RUNNER_TEMP\openssl"
          Push-Location "$env:RUNNER_TEMP\openssl"
          perl Configure VC-WIN64A no-shared no-tests "--prefix=$prefix" "--openssldir=$prefix\ssl"
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL configure failed' }
          nmake /NOLOGO
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL build failed' }
          nmake /NOLOGO install_sw
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL install failed' }
          Pop-Location

          # liboqs is unsupported by vcpkg for windows-static triplets, so the
          # official release is built from source here instead.
          git clone --depth 1 --branch "$env:LIBOQS_VERSION" https://github.com/open-quantum-safe/liboqs.git "$env:RUNNER_TEMP\liboqs"
          cmake -S "$env:RUNNER_TEMP\liboqs" -B "$env:RUNNER_TEMP\liboqs-build" `
            -G "${{ matrix.generator }}" -A ${{ matrix.architecture }} `
            -DCMAKE_INSTALL_PREFIX="$prefix" -DOPENSSL_ROOT_DIR="$prefix" `
            -DBUILD_SHARED_LIBS=OFF -DOQS_BUILD_ONLY_LIB=ON `
            "-DOQS_MINIMAL_BUILD=KEM_ml_kem_1024;SIG_ml_dsa_87"
          if ($LASTEXITCODE -ne 0) { throw 'liboqs configure failed' }
          cmake --build "$env:RUNNER_TEMP\liboqs-build" --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'liboqs build failed' }
          cmake --install "$env:RUNNER_TEMP\liboqs-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw 'liboqs install failed' }

      - name: Verify official upstream dependency versions
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP\pqvpn-deps"
          $opensslVersion = & "$prefix\bin\openssl.exe" version
          if ($opensslVersion -notmatch "^OpenSSL $([regex]::Escape($env:OPENSSL_VERSION)) ") { throw "Unexpected OpenSSL version: $opensslVersion" }
          $oqsConfig = Get-Content "$prefix\include\oqs\oqsconfig.h" | Out-String
          if ($oqsConfig -notmatch "OQS_VERSION_TEXT\s+`"$([regex]::Escape($env:LIBOQS_VERSION))`"") { throw 'Unexpected liboqs version' }

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-v2-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('.github/dependencies.env', 'CMakeLists.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Install dependencies with vcpkg
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-bincache,readwrite
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}/vcpkg-bincache" | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "argon2:${{ matrix.triplet }}"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }
          $argonVersion = & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" list "argon2:${{ matrix.triplet }}" | Out-String
          if ($argonVersion -notmatch "argon2:${{ matrix.triplet }}\s+$([regex]::Escape($env:ARGON2_VERSION))") {
            throw "Expected upstream Argon2 $env:ARGON2_VERSION, got: $argonVersion"
          }

      - name: Install upstream Qt for the native GUI
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ env.QT_VERSION }}'
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" `
            -A ${{ matrix.architecture }} `
            -DBUILD_TESTING=OFF `
            -DPQVPN_BUILD_MONITOR=ON `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$env:RUNNER_TEMP\pqvpn-deps" `
            "-DOPENSSL_ROOT_DIR=$env:RUNNER_TEMP\pqvpn-deps" `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Compile node, terminal console and native GUI
        run: cmake --build build --config Release --target pqvpn_node pqvpn_tui pqvpn_monitor --parallel 2

      - name: Render Privacy Console
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PQVPN_SMOKE_PAGE = 'strangenet'
          $env:PQVPN_SMOKE_IMAGE = "$env:RUNNER_TEMP\pqvpn-console.png"
          & build/Release/pqvpn_monitor.exe --smoke-test
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $env:PQVPN_SMOKE_IMAGE)) { throw 'GUI smoke test failed' }

      - name: Compile PQVPN x64 tunnel driver
        shell: pwsh
        run: |
          msbuild driver/pqvpn_tunnel/pqvpn_tunnel.vcxproj /t:Restore /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'WDK restore failed' }
          $wdk = "$env:USERPROFILE\.nuget\packages\microsoft.windows.wdk.x64\10.0.28000.2526\c"
          $env:PATH = "$wdk\bin\10.0.28000.0\x64;$env:PATH"
          $sdkPackage = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.cpp\10.0.28000.*" |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdkPackage) { throw 'Matching Windows SDK NuGet package was not restored' }
          $sdk = Join-Path $sdkPackage.FullName 'c'
          msbuild driver/pqvpn_tunnel/pqvpn_tunnel.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off `
            /p:SkipPackageVerification=true "/p:WindowsSdkDir=$sdk\" "/p:WDKContentRoot=$wdk\" /m
          if ($LASTEXITCODE -ne 0) { throw 'PQVPN tunnel driver build failed' }
          if (-not (Test-Path driver/build/x64/Release/pqvpn_tunnel.sys)) {
            throw 'Driver build did not produce pqvpn_tunnel.sys'
          }

      - name: Verify architecture and CLI startup
        shell: pwsh
        run: |
          $binary = 'build/Release/pqvpn_node.exe'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC\*\bin\Host*\*\dumpbin.exe" |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            throw 'Could not locate dumpbin in the Visual Studio installation'
          }
          $headers = & $dumpbin /headers $binary | Out-String
          $headers | Set-Content binary-headers.txt
          if ($headers -notmatch '${{ matrix.expected_arch }}') {
            throw 'Unexpected executable architecture'
          }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI help failed' }
          & $binary --validate-config --config config.json
          if ($LASTEXITCODE -ne 0) { throw 'CLI configuration validation failed' }
          & $binary --platform-info
          if ($LASTEXITCODE -ne 0) { throw 'CLI platform inspection failed' }
          & $binary --smoke-test --config config.json
          if ($LASTEXITCODE -ne 0) { throw "Default config smoke test failed" }
          & $binary --smoke-test --config config.udp2raw.json
          if ($LASTEXITCODE -ne 0) { throw 'CLI smoke test failed' }
          & build/Release/pqvpn_tui.exe --smoke-test --config config.json
          if ($LASTEXITCODE -ne 0) { throw 'TUI smoke test failed' }
          & $dumpbin /dependents $binary | Set-Content runtime-dependencies.txt

      - name: Read package version
        shell: pwsh
        run: |
          $version = (Get-Content PQVPN_VERSION.txt -Raw).Trim()
          if (-not $version) { throw 'PQVPN_VERSION.txt is empty' }
          "PQVPN_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify install layout
        shell: pwsh
        run: |
          $stage = "PQVPN-${{ env.PQVPN_VERSION }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          cmake --install build --config Release --prefix (Resolve-Path $stage).Path
          if (-not (Test-Path "$stage\bin\pqvpn_node.exe")) { throw 'node was not installed under bin' }
          if (-not (Test-Path "$stage\bin\pqvpn_tui.exe")) { throw 'TUI was not installed under bin' }
          if (-not (Test-Path "$stage\bin\pqvpn_monitor.exe")) { throw 'GUI was not installed under bin' }

      - name: Build portable package
        shell: pwsh
        run: |
          packaging/windows/build-installer.ps1 -BuildDir build/Release -OutputDir artifacts -Version $env:PQVPN_VERSION
          if (-not (Get-ChildItem artifacts -Filter '*.zip')) { throw 'portable zip was not produced' }

      - name: Build MSI installer
        shell: pwsh
        run: |
          $ver = $env:PQVPN_VERSION
          $base = ($ver -split '-')[0]
          $build = '1'
          if ($ver -match '\d{4}') { $build = $matches[0].Substring(0,4) }
          $msiVersion = "$base.$build"
          # Stage the install tree (bin/share/etc) and deploy the Qt runtime
          # next to the GUI so the harvested MSI bundle is self-contained.
          $stage = 'msi-stage'
          cmake --install build --config Release --prefix $stage
          $wdq = Get-ChildItem "$env:RUNNER_TEMP\Qt" -Recurse -Filter 'windeployqt.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($wdq) { & $wdq --release --no-translations --no-opengl-sw "$stage\bin\pqvpn_monitor.exe"; if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed for MSI stage' } }
          # Locate the WiX v3 toolset (candle/light/heat) on the runner.
          $candle = (Get-Command candle.exe -ErrorAction SilentlyContinue).Source
          $light  = (Get-Command light.exe  -ErrorAction SilentlyContinue).Source
          if (-not $candle -or -not $light) {
            $found = Get-ChildItem 'C:\Program Files*\WiX*\bin\candle.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $candle = $found.FullName; $light = Join-Path (Split-Path $found.FullName) 'light.exe' }
          }
          if (-not (Test-Path $candle) -or -not (Test-Path $light)) { throw 'WiX candle/light not found on runner' }
          $heat = Join-Path (Split-Path $candle) 'heat.exe'
          New-Item -ItemType Directory -Path msi-build -Force | Out-Null
          & $heat dir $stage -dr INSTALLDIR -cg ProductComponents -sreg -sfrag -gg -ke -out msi-build/files.wxs
          if ($LASTEXITCODE -ne 0) { throw 'heat failed' }
          & $candle -arch x64 -dMsiVersion="$msiVersion" packaging/windows/pqvpn.wxs msi-build/files.wxs -o msi-build/
          if ($LASTEXITCODE -ne 0) { throw 'candle failed' }
          # ICE38/43/57 fire for common (All Users) Start Menu shortcuts in a
          # per-machine install with a per-machine KeyPath; this is the
          # well-known false-positive pattern, so suppress those specific ICEs.
          & $light -ext WixUIExtension -ext WixUtilExtension -sice:ICE38 -sice:ICE43 -sice:ICE57 -b $stage msi-build/pqvpn.wixobj msi-build/files.wixobj -o "artifacts/PQVPN-$ver-windows-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw 'light failed' }
          if (-not (Get-ChildItem artifacts -Filter '*.msi')) { throw 'MSI was not produced' }

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ matrix.target }}
          path: |
            artifacts/*.zip
            artifacts/*.msi
          if-no-files-found: error
          retention-days: 7

  ci-matrix-complete:
    name: CI matrix complete
    if: always()
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native build
        env:
          UNIX_RESULT: ${{ needs.unix.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          test "$UNIX_RESULT" = success
          test "$WINDOWS_RESULT" = success
          echo 'Every native configure, compile, help and smoke test passed.'

  publish-tagged-release:
    name: Publish matrix-verified prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci-matrix-complete]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download every matrix artifact
        uses: actions/download-artifact@v7
        with:
          pattern: release-candidate-*
          path: release
          merge-multiple: true
      - name: Verify complete release set and checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" = 1
          test "$(find release -maxdepth 1 -type f -name '*.msi' | wc -l)" = 1
          test "$(find release -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" = 4
          test "$(find release -maxdepth 1 -type f -name '*.deb' | wc -l)" = 2
          (cd release && sha256sum *.zip *.msi *.tar.gz *.deb | sort -k2 > SHA256SUMS)
      - name: Create immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 && {
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to mutate it." >&2
            exit 1
          }
          # Experimental prerelease: matrix-verified compile and smoke evidence only.
          # Fully qualified releases are published exclusively by
          # publish-qualified-release.yml after the native functional gates pass.
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --prerelease --generate-notes \
            --title "PQVPN ${GITHUB_REF_NAME} (experimental prerelease)"
